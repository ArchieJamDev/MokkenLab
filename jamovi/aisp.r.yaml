      - alpha
      - typeZ
      - testHi
      - startSet

  - name: interpretation
    title: Applied interpretation
    type: Html

  - name: reproducibility
    title: Reproducibility
    type: Html
    visible: (showRepro)

  - name: reproducibilityCode
    title: Equivalent R code
    type: Preformatted
    visible: (showRepro)
