name: aisp
title: Automated Item Selection
jrs: '1.1'

items:
  # Hidden store of mokken results already computed in this session, so a
  # cosmetic change (plot size, palette, language) does not recompute them
  # (.mk_cached_capture() in R/shared-helpers.R). Keys hash the data and the
  # arguments; clearWith lists the data options only to bound its size.
  # ES: Almacén oculto de resultados de mokken ya calculados en la sesión,
  # para que un cambio cosmético no los recalcule. Las claves resumen los
  # datos y los argumentos; clearWith lista solo las opciones de datos para
  # limitar su tamaño.
  - name: cacheStore
    type: Html
    visible: false
    clearWith:
      - vars
      - negItems
      - naHandling
      - twowaySets
      - twowaySeed
      - scoreRange
      - scoreMin
      - scoreMax
      - clusterVar

  - name: intro
    title: Introduction
    type: Html

  - name: keySummary
    title: Key findings
    type: Html
    visible: (showKeySummary)

  - name: choicesGuide
    title: About your choices
    type: Html
    visible: (showChoicesGuide)

  - name: aispGuide
    title: How the automated item selection works
    type: Html
    visible: (showGuides)

  - name: summary
    title: Analysis summary
    type: Table
    rows: 0
    refs:
      - mokken_pkg
      - vanderark_2012
    clearWith:
      - vars
      - negItems
      - naHandling
      - twowaySets
      - twowaySeed
      - scoreRange
      - scoreMin
      - scoreMax
      - clusterVar
      - lbMode
      - lowerbound
      - lbFrom
      - lbTo
      - lbStep
      - search
      - popsize
      - maxgensMode
      - maxgens
      - pxover
      - pmutation
      - gaSeed
      - alpha
      - typeZ
      - testHi
      - startSet
    columns:
      - name: element
        title: "Element"
        type: text
      - name: value
        title: "Value"
        type: text

  - name: membership
    title: Scale membership
    type: Table
    rows: (vars)
    visible: (lbMode:single)
    refs:
      - mokken_1971
      - molenaar_sijtsma_2000
      - straat_2013
    clearWith:
      - vars
      - negItems
      - naHandling
      - twowaySets
      - twowaySeed
      - scoreRange
      - scoreMin
      - scoreMax
      - clusterVar
      - lbMode
      - lowerbound
      - lbFrom
      - lbTo
      - lbStep
      - search
      - popsize
      - maxgensMode
      - maxgens
      - pxover
      - pmutation
      - gaSeed
      - alpha
      - typeZ
      - testHi
      - startSet
    columns:
      - name: item
        title: "Item"
        type: text
        content: ($key)
      - name: scale
        title: "Scale"
        type: text
      - name: hi
        title: "Hi in its scale"
        type: number
        format: zto
        visible: (scaleCoefs)

  - name: scales
    title: Scalability of each scale
    type: Table
    rows: 0
    visible: (lbMode:single && scaleCoefs)
    refs:
      - kuijpers_2013
    clearWith:
      - vars
      - negItems
      - naHandling
      - twowaySets
      - twowaySeed
      - scoreRange
      - scoreMin
      - scoreMax
      - clusterVar
      - lbMode
      - lowerbound
      - lbFrom
      - lbTo
      - lbStep
      - search
      - popsize
      - maxgensMode
      - maxgens
      - pxover
      - pmutation
      - gaSeed
      - alpha
      - typeZ
      - testHi
      - startSet
      - scaleCoefs
    columns:
      - name: scale
        title: "Scale"
        type: text
      - name: nItems
        title: "Items"
        type: integer
      - name: items
        title: "Item list"
        type: text
      - name: h
        title: "H"
        type: number
        format: zto
      - name: se
        title: "SE"
        type: number
        format: zto
      - name: lower
        title: "Lower"
        type: number
        format: zto
      - name: upper
        title: "Upper"
        type: number
        format: zto
      - name: minHi
        title: "Lowest Hi"
        type: number
        format: zto
      - name: strength
        title: "Strength"
        type: text

  - name: bootGuide
    title: How to read bootstrap stability
    type: Html
    visible: (showGuides && lbMode:single && bootStability)

  - name: bootTable
    title: Bootstrap stability of the partition
    type: Table
    rows: 0
    visible: (lbMode:single && bootStability)
    clearWith:
      - vars
      - negItems
      - naHandling
      - twowaySets
      - twowaySeed
      - scoreRange
      - scoreMin
      - scoreMax
      - clusterVar
      - lbMode
      - lowerbound
      - lbFrom
      - lbTo
      - lbStep
      - search
      - popsize
      - maxgensMode
      - maxgens
      - pxover
      - pmutation
      - gaSeed
      - alpha
      - typeZ
      - testHi
      - startSet
      - bootStability
      - bootReps
      - bootSeed
    columns:
      - name: item
        title: "Item"
        type: text
      - name: scale
        title: "Scale"
        type: text
      - name: together
        title: "With its scale-mates"
        type: number
        format: zto
      - name: same
        title: "Same scale as found"
        type: number
        format: zto
      - name: unscalable
        title: "Unscalable"
        type: number
        format: zto

  - name: bootPlotImg
    title: Bootstrap co-membership of item pairs
    type: Image
    width: 600
    height: 500
    renderFun: .plotBoot
    visible: (lbMode:single && bootStability && bootPlot)
    clearWith:
      - vars
      - negItems
      - naHandling
      - twowaySets
      - twowaySeed
      - scoreRange
      - scoreMin
      - scoreMax
      - clusterVar
      - lbMode
      - lowerbound
      - lbFrom
      - lbTo
      - lbStep
      - search
      - popsize
      - maxgensMode
      - maxgens
      - pxover
      - pmutation
      - gaSeed
      - alpha
      - typeZ
      - testHi
      - startSet
      - bootStability
      - bootReps
      - bootSeed
      - bootPlot
      - plotWidth
      - plotHeight
      - plotPointSize
      - plotLineWidth
      - plotNcol
      - plotLegend
      - plotAxisAngle
      - plotYRange
      - plotValueLabels

  - name: sequenceGuide
    title: How to read the sequence of lower bounds
    type: Html
    visible: (showGuides && lbMode:sequence)

  - name: sequence
    title: Scale membership across lower bounds
    type: Table
    rows: (vars)
    visible: (lbMode:sequence)
    refs:
      - hemker_1995
      - sijtsma_vanderark_2017
    clearWith:
      - vars
      - negItems
      - naHandling
      - twowaySets
      - twowaySeed
      - scoreRange
      - scoreMin
      - scoreMax
      - clusterVar
      - lbMode
      - lowerbound
      - lbFrom
      - lbTo
      - lbStep
      - search
      - popsize
      - maxgensMode
      - maxgens
      - pxover
      - pmutation
      - gaSeed
      - alpha
      - typeZ
      - testHi
      - startSet
    columns:
      - name: item
        title: "Item"
        type: text
        content: ($key)

  - name: sequenceSummary
    title: Partition at each lower bound
    type: Table
    rows: 0
    visible: (lbMode:sequence)
    clearWith:
      - vars
      - negItems
      - naHandling
      - twowaySets
      - twowaySeed
      - scoreRange
      - scoreMin
      - scoreMax
      - clusterVar
      - lbMode
      - lowerbound
      - lbFrom
      - lbTo
      - lbStep
      - search
      - popsize
      - maxgensMode
      - maxgens
      - pxover
      - pmutation
      - gaSeed
      - alpha
      - typeZ
      - testHi
      - startSet
    columns:
      - name: lb
        title: "Lower bound"
        type: number
        format: zto
      - name: nScales
        title: "Scales"
        type: integer
      - name: nUnscalable
        title: "Unscalable items"
        type: integer
      - name: largest
        title: "Items in the largest scale"
        type: integer

  - name: scalePlotImg
    title: Item scalability within each scale
    type: Image
    width: 650
    height: 450
    renderFun: .plotScales
    visible: (lbMode:single && scalePlot)
    clearWith:
      - scaleCoefs
      - scalePlot
      - plotValueLabels
      - plotYRange
      - plotAxisAngle
      - plotLegend
      - plotNcol
      - plotLineWidth
      - plotPointSize
      - plotHeight
      - plotWidth
      - vars
      - negItems
      - naHandling
      - twowaySets
      - twowaySeed
      - scoreRange
      - scoreMin
      - scoreMax
      - clusterVar
      - lbMode
      - lowerbound
      - lbFrom
      - lbTo
      - lbStep
      - search
      - popsize
      - maxgensMode
      - maxgens
      - pxover
      - pmutation
      - gaSeed
      - alpha
      - typeZ
      - testHi
      - startSet

  - name: sequencePlot
    title: Scale membership across lower bounds
    type: Image
    width: 650
    height: 450
    renderFun: .plotSequence
    visible: (lbMode:sequence && sequencePlot)
    clearWith:
      - plotValueLabels
      - plotYRange
      - plotAxisAngle
      - plotLegend
      - plotNcol
      - plotLineWidth
      - plotPointSize
      - plotHeight
      - plotWidth
      - vars
      - negItems
      - naHandling
      - twowaySets
      - twowaySeed
      - scoreRange
      - scoreMin
      - scoreMax
      - clusterVar
      - lbMode
      - lowerbound
      - lbFrom
