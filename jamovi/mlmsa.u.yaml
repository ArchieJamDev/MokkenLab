title: Two-Level Mokken Scale Analysis
name: mlmsa
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: true
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Subject (Rated Person)
        children:
          - type: VariablesListBox
            name: subject
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Items
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: Negatively Worded Items (Reversed)
        children:
          - type: VariablesListBox
            name: negItems
            isTarget: true
            height: small
  - type: CollapseBox
    label: Report Content
    collapsed: true
    children:
      - type: CheckBox
        name: showKeySummary
      - type: CheckBox
        name: showChoicesGuide
      - type: CheckBox
        name: showGuides
      - type: CheckBox
        name: showRepro
  - type: CollapseBox
    label: Data
    collapsed: true
    children:
      - type: ComboBox
        name: naHandling
      - type: TextBox
        name: twowaySets
        format: number
        enable: (naHandling:twoway)
      - type: TextBox
        name: twowaySeed
        format: number
        enable: (naHandling:twoway)
      - type: ComboBox
        name: scoreRange
      - type: TextBox
        name: scoreMin
        format: number
        enable: (scoreRange:manual)
      - type: TextBox
        name: scoreMax
        format: number
        enable: (scoreRange:manual)
  - type: CollapseBox
    label: Two-Level Coefficients
    collapsed: true
    children:
      - type: CheckBox
        name: se
      - type: CheckBox
        name: ci
        children:
          - type: TextBox
            name: ciWidth
            format: number
            suffix: '%'
            enable: (ci)
          - type: ComboBox
            name: typeCI
            enable: (ci)
      - type: CheckBox
        name: weighProps
      - type: CheckBox
        name: showHij
      - type: CheckBox
        name: showCov
      - type: CheckBox
        name: showZ
        children:
          - type: ComboBox
            name: typeZ
            enable: (showZ)
          - type: TextBox
            name: zLowerbound
            format: number
            enable: (showZ)
  - type: CollapseBox
    label: Intraclass Correlations and Weights
    collapsed: true
    children:
      - type: CheckBox
        name: showICC
      - type: CheckBox
        name: showWeights
  - type: CollapseBox
    label: Plots
    collapsed: true
    children:
      - type: CheckBox
        name: levelPlot
  - type: CollapseBox
    label: Plot Settings
    collapsed: true
    children:
      - type: TextBox
        name: plotWidth
        format: number
      - type: TextBox
        name: plotHeight
        format: number
      - type: TextBox
        name: plotPointSize
        format: number
      - type: TextBox
        name: plotLineWidth
        format: number
      - type: TextBox
        name: plotNcol
        format: number
      - type: ComboBox
        name: plotLegend
      - type: ComboBox
        name: plotAxisAngle
      - type: ComboBox
        name: plotYRange
      - type: CheckBox
        name: plotValueLabels
