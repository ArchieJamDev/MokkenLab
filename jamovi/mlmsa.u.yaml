title: Two-Level Mokken Scale Analysis
name: mlmsa
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Subject (rated person)
        children:
          - type: VariablesListBox
            name: subject
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Items
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
  - type: CollapseBox
    label: Report Language
    collapsed: false
    children:
      - type: ComboBox
        name: reportLang
      - type: CheckBox
        name: showKeySummary
      - type: CheckBox
        name: showChoicesGuide
      - type: CheckBox
        name: showGuides
  - type: CollapseBox
    label: Data
    collapsed: true
    children:
      - type: ComboBox
        name: naHandling
      - type: TextBox
        name: twowaySets
        format: number
        enable: (naHandling:twoway)
      - type: TextBox
        name: twowaySeed
        format: number
        enable: (naHandling:twoway)
      - type: ComboBox
        name: scoreRange
      - type: TextBox
        name: scoreMin
        format: number
        enable: (scoreRange:manual)
      - type: TextBox
        name: scoreMax
        format: number
        enable: (scoreRange:manual)
      - type: VariableSupplier
        persistentItems: true
        stretchFactor: 1
        suggested:
          - ordinal
          - continuous
        permitted:
          - numeric
        children:
          - type: TargetLayoutBox
            label: Negatively worded items
            children:
              - type: VariablesListBox
                name: negItems
                isTarget: true
                height: small
  - type: CollapseBox
    label: Two-level coefficients
    collapsed: true
    children:
      - type: CheckBox
        name: se
      - type: CheckBox
        name: ci
        children:
          - type: TextBox
            name: ciWidth
            format: number
            suffix: '%'
            enable: (ci)
          - type: ComboBox
            name: typeCI
            enable: (ci)
      - type: CheckBox
        name: weighProps
      - type: CheckBox
        name: showHij
      - type: CheckBox
        name: showCov
      - type: CheckBox
        name: showZ
        children:
          - type: ComboBox
            name: typeZ
            enable: (showZ)
          - type: TextBox
            name: zLowerbound
            format: number
            enable: (showZ)
  - type: CollapseBox
    label: Intraclass correlations and weights
    collapsed: true
    children:
      - type: CheckBox
        name: showICC
      - type: CheckBox
        name: showWeights
  - type: CollapseBox
    label: Plots
    collapsed: true
    children:
      - type: CheckBox
        name: levelPlot
  - type: CollapseBox
    label: Plot settings
    collapsed: true
    children:
      - type: TextBox
        name: plotWidth
        format: number
      - type: TextBox
        name: plotHeight
        format: number
      - type: TextBox
        name: plotPointSize
        format: number
      - type: TextBox
        name: plotLineWidth
        format: number
      - type: TextBox
        name: plotNcol
        format: number
      - type: ComboBox
        name: plotLegend
      - type: ComboBox
        name: plotAxisAngle
      - type: ComboBox
        name: plotYRange
      - type: CheckBox
        name: plotValueLabels
      - type: ComboBox
        name: plotPalette
