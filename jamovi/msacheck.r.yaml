      - iioAlpha
      - iioItemSelection
      - iioOrder
      - iioClusterSize
      - iioOrderText
      - minsizeMode
      - minsize
      - restMinvi
      - pmatMinvi
      - checkMono
      - checkIIO
      - checkRest
      - checkPmatrix
      - checkCA
    columns:
      - name: element
        title: "Element"
        type: text
      - name: value
        title: "Value"
        type: text

