name: msacheck
title: Model Assumptions
jrs: '1.1'

items:
  - name: intro
    title: Introduction
    type: Html

  - name: keySummary
    title: Key findings
    type: Html
    visible: (showKeySummary)

  - name: choicesGuide
    title: About your choices
    type: Html
    visible: (showChoicesGuide)

  - name: summary
    title: Analysis summary
    type: Table
    rows: 0
    refs:
      - mokken_pkg
      - vanderark_2007
      - sijtsma_vanderark_2017
    clearWith:
      - vars
      - negItems
      - naHandling
      - twowaySets
      - twowaySeed
      - scoreRange
      - scoreMin
      - scoreMax
      - reportLang
      - clusterVar
      - minsizeMode
      - minsize
      - monoMinvi
      - minsizeMode
      - minsize
      - iioMethod
      - iioMinviMode
